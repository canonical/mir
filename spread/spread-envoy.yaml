static_resources:
  listeners:
  - name: forward_proxy
    address:
      socket_address: {address: "0.0.0.0", port_value: 3128}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: forward
          codec_type: HTTP1
          http_protocol_options: {allow_absolute_url: true}
          request_headers_timeout: 10s
          stream_idle_timeout: 0s
          upgrade_configs: [{upgrade_type: CONNECT}]
          access_log: &access_log
          - name: envoy.access_loggers.stderr
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StderrAccessLog
              log_format:
                json_format:
                  cluster: "%UPSTREAM_CLUSTER%"
                  status: "%RESPONSE_CODE%"
                  attempts: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%"
                  flags: "%RESPONSE_FLAGS%"
                  url: "%REQ(:SCHEME)%://%REQ(:AUTHORITY)%%REQ(:PATH)%"
          route_config:
            name: forward
            virtual_hosts:
            - name: mirrors
              domains: &mirrors
              - archive.ubuntu.com
              - archive.ubuntu.com:80
              - archive.ubuntu.com:443
              - azure.archive.ubuntu.com
              - azure.archive.ubuntu.com:80
              - azure.archive.ubuntu.com:443
              - security.ubuntu.com
              - security.ubuntu.com:80
              - security.ubuntu.com:443
              - ports.ubuntu.com
              - ports.ubuntu.com:80
              - ports.ubuntu.com:443
              - ppa.launchpad.net
              - ppa.launchpad.net:80
              - ppa.launchpad.net:443
              - ppa.launchpadcontent.net
              - ppa.launchpadcontent.net:80
              - ppa.launchpadcontent.net:443
              - deb.debian.org
              - deb.debian.org:80
              - deb.debian.org:443
              - cdn-fastly.deb.debian.org
              - cdn-fastly.deb.debian.org:80
              - cdn-fastly.deb.debian.org:443
              - ftp.debian.org
              - ftp.debian.org:80
              - ftp.debian.org:443
              - security.debian.org
              - security.debian.org:80
              - security.debian.org:443
              - mirrors.fedoraproject.org
              - mirrors.fedoraproject.org:80
              - mirrors.fedoraproject.org:443
              - download.fedoraproject.org
              - download.fedoraproject.org:80
              - download.fedoraproject.org:443
              - dl.fedoraproject.org
              - dl.fedoraproject.org:80
              - dl.fedoraproject.org:443
              - dl-cdn.alpinelinux.org
              - dl-cdn.alpinelinux.org:80
              - dl-cdn.alpinelinux.org:443
              routes:
              - match: &https_connect
                  connect_matcher: {}
                  headers:
                  - name: ":authority"
                    string_match: {safe_regex: {regex: "[^:]+:443"}}
                route:
                  cluster: interception
                  timeout: 0s
                  idle_timeout: 0s
                  upgrade_configs: &connect_upgrade
                  - upgrade_type: CONNECT
                    connect_config: {}
              - &http_route
                match:
                  prefix: "/"
                  headers:
                  - &read_methods
                    name: ":method"
                    string_match: {safe_regex: {regex: "GET|HEAD"}}
                  - name: ":authority"
                    string_match: {safe_regex: {regex: "[^:]+(:80)?"}}
                route:
                  cluster: http_mirrors
                  timeout: 0s
                  idle_timeout: 150s
                  retry_policy: &retries
                    retry_on: connect-failure,reset,retriable-status-codes
                    retriable_status_codes: [500, 502, 503, 504]
                    num_retries: 3
                    per_try_timeout: 20s
                    per_try_idle_timeout: 30s
                    retry_back_off: {base_interval: 1s, max_interval: 4s}
              - &deny_connect
                match: {connect_matcher: {}}
                direct_response: {status: 403}
              - &deny
                match: {prefix: "/"}
                direct_response: {status: 403}
            - name: passthrough
              domains: ["*"]
              routes:
              - match: *https_connect
                route:
                  cluster: https_tunnels
                  timeout: 0s
                  idle_timeout: 0s
                  upgrade_configs: *connect_upgrade
              - *http_route
              - *deny_connect
              - *deny
          http_filters: &http_filters
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config: &dns_cache
                name: mirrors
                dns_lookup_family: V4_ONLY
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  - name: interception
    address:
      pipe: {path: /run/mir-sbuild-proxy/interception.sock}
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain: {filename: /etc/envoy/proxy.crt}
              private_key: {filename: /etc/envoy/proxy.key}
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: decrypted
          codec_type: HTTP1
          request_headers_timeout: 10s
          stream_idle_timeout: 150s
          access_log: *access_log
          route_config:
            name: decrypted
            virtual_hosts:
            - name: mirrors
              domains: *mirrors
              routes:
              - match:
                  prefix: "/"
                  headers:
                  - *read_methods
                  - name: ":authority"
                    string_match: {safe_regex: {regex: "[^:]+(:443)?"}}
                route:
                  cluster: https_mirrors
                  timeout: 0s
                  idle_timeout: 150s
                  retry_policy: *retries
              - *deny
            - name: deny
              domains: ["*"]
              routes: [*deny]
          http_filters: *http_filters
  clusters:
  - name: interception
    connect_timeout: 5s
    type: STATIC
    load_assignment:
      cluster_name: interception
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              pipe: {path: /run/mir-sbuild-proxy/interception.sock}
  - name: http_mirrors
    connect_timeout: 5s
    lb_policy: CLUSTER_PROVIDED
    cluster_type: &dynamic_cluster
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config: *dns_cache
  - name: https_mirrors
    connect_timeout: 5s
    lb_policy: CLUSTER_PROVIDED
    cluster_type: *dynamic_cluster
    upstream_http_protocol_options:
      auto_sni: true
      auto_san_validation: true
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
  - name: https_tunnels
    connect_timeout: 5s
    lb_policy: CLUSTER_PROVIDED
    cluster_type: *dynamic_cluster
