summary: Build (on Alpine)
systems: [alpine-*]
variants: [amd64, "*ld"]

execute: |
    if [ -n "${SBUILD_PROXY_URL}" ]; then
        if ! command -v update-ca-certificates > /dev/null; then
            apk add ca-certificates
        fi
        mkdir -p /usr/local/share/ca-certificates
        printf '%s' "${SBUILD_PROXY_CA}" | base64 -d \
            > /usr/local/share/ca-certificates/mir-sbuild-proxy.crt
        update-ca-certificates
        export http_proxy="${SBUILD_PROXY_URL}" https_proxy="${SBUILD_PROXY_URL}"
        export no_proxy=localhost,127.0.0.1,::1
        unset NO_PROXY
    fi

    apk add \
        boost-dev \
        cargo \
        ccache \
        cmake \
        coreutils \
        diffutils \
        elogind \
        eudev-dev \
        freetype-dev \
        g++ \
        glib-dev \
        glm-dev \
        grep \
        gtest-dev \
        libdisplay-info-dev \
        libepoxy-dev \
        libevdev-dev \
        libinput-dev \
        libxcursor-dev \
        libxkbcommon-dev \
        libxml++-2.6-dev \
        lttng-ust-dev \
        lttng-ust-tools \
        make \
        mesa-dev \
        nettle-dev \
        py3-dbusmock \
        py3-pillow \
        umockdev-dev \
        wayland-dev \
        yaml-cpp-dev \
        libapparmor-dev \
        wlcs-dev \
        pixman-dev \
        xwayland

    if [ "${LINKER}" != "ld" ]; then
        apk add "${LINKER}"
    fi

    BUILD_DIR=$PWD/../build
    CMAKE_OPTIONS=(
        -H$SPREAD_PATH -B$BUILD_DIR
        -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DMIR_USE_LD=${LINKER}
        -DMIR_ENABLE_WLCS_TESTS=OFF
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    )
    cmake "${CMAKE_OPTIONS[@]}"
    export VERBOSE=1
    cmake --build $BUILD_DIR -- -j`nproc`

    export XDG_RUNTIME_DIR=/tmp
    cmake --build $BUILD_DIR -- ptest

    ccache --show-stats --zero-stats > ${CCACHE_DIR}/ccache.stats
