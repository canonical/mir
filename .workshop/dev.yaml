name: dev
description: |
  A development environment for Mir.
  Provides a Ubuntu 26.04 base with VS Code Remote, GitHub Copilot, and the Mir project SDK.
  Includes actions for configuring (cmake), building (build), and documentation generation (doc),
  exposed via a tunnel on `localhost:8000`.

  Connect the `desktop` interface (`workshop connect dev/mir:desktop`) to run the built server with `workshop exec <executable>` displayed on the host.

  Mount the `wlcs-build` plug to the build directory of `wlcs`, so that the `wlcs` binary
  is available at `/home/workshop/wlcs-build/wlcs`.

  Use `workshop run wlcs` (the default) to run the registered `ctest` suite against the
  system wlcs package. Use `workshop run wlcs mounted` to run against the mounted
  `wlcs-build` binary instead.
base: ubuntu@26.04
sdks:
- name: vscode-remote
- name: copilot
- name: project-mir
- name: system
actions:
  configure: |
    set -xeu
    cmake \
      -DCMAKE_BUILD_TYPE=Debug \
      -DCMAKE_INSTALL_PREFIX=$HOME/install \
      -DCMAKE_C_COMPILER=clang \
      -DCMAKE_CXX_COMPILER=clang++ \
      -DMIR_USE_LD=mold \
      -DCMAKE_C_COMPILER_LAUNCHER=ccache \
      -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
      -B $HOME/build \
      -G Ninja \
      . \
      "$@"

  build: |
    set -xeu
    cmake --build ~/build "$@"

  coverage: |
    set -xeu
    cmake -S . -B ~/build -DMIR_ENABLE_COVERAGE=ON
    cmake --build ~/build --target coverage-html "$@"
    echo
    echo "Coverage report available at http://$( hostname -f ):8001/"

  package: |
    set -xeu
    cd $HOME
    rsync --archive --delete --filter='P build-*' --progress /project/ project/
    cd project
    cat <<EOF > debian/opts.mk
      OVERRIDE_CONFIGURE_OPTIONS += -DCMAKE_C_COMPILER_LAUNCHER=ccache
      OVERRIDE_CONFIGURE_OPTIONS += -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    EOF
    DEB_BUILD_OPTIONS="nocheck nostrip parallel=$(nproc) ${DEB_BUILD_OPTIONS:-}" \
      dpkg-buildpackage \
        --no-pre-clean \
        --unsigned-changes \
        --unsigned-source \
        "$@"

  test: |
    set -xeu
    cmake --build ~/build
    VERBOSE=1 ARGS="-V" cmake --build ~/build --target ptest "$@"

  wlcs: |
    set -xeu

    mode=system
    if [ $# -ge 1 ] && { [ "$1" = "system" ] || [ "$1" = "mounted" ]; }; then
      mode="$1"
      shift
    fi

    if [ "$mode" = "mounted" ]; then
      if [ ! -x /home/workshop/wlcs-build/wlcs ]; then
        echo 'wlcs binary not found at /home/workshop/wlcs-build/wlcs'
        echo 'ensure `wlcs-build` plug is mounted to the wlcs build directory'
        exit 1
      fi
      configure_options="-DWLCS_BINARY=/home/workshop/wlcs-build/wlcs"
    else
      # Revert to the system wlcs binary; without this a previous `mounted` run would
      # leave its cached path in place and following system runs would reuse it.
      configure_options="-UWLCS_BINARY"
    fi

    cmake -S . -B ~/build $configure_options

    cmake --build ~/build --target miral_wlcs_integration

    cd ~/build
    ctest -R 'wlcs.*' "$@"

  doc: |
    set -xeu

    if [ "$#" -gt "0" ]; then
      target="$1"
      shift
    fi

    SPHINX_HOST=$( hostname -f ) cmake --build ~/build --target "doc-${target:-run}" "$@"
