name: TICS

on:
  push:
    branches:
    - main
    paths-ignore:
    - ".github/**"
    - "!.github/workflows/tics.yml"
    - "*.md"
    - "COPYING.*"
    - "doc/**"
    - "snap/**"
    - "spread.yaml"
    - "spread/**"
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      detach:
        description: "Detach TICS QServer before the run"
        required: false
        default: "false"
      calc:
        description: "Comma-separated list of metrics to be calculated."
        required: false
        default: "ALL"
      nocalc:
        description: "Comma-separated list of metrics to not be calculated."
        required: false
        default: ""

concurrency:
  # Group and interrupt pull requests and merge queue runs, everything else needs to queue
  group: ${{ github.workflow }}-${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && github.ref || 'qserver' }}
  cancel-in-progress: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) }}

permissions: {}

jobs:
  check-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Only run if we have access to secrets, and relevant files changed.
      should-run: ${{ (github.event_name != 'pull_request' || github.repository == github.event.pull_request.head.repo.full_name) && (steps.filter.outputs.code == 'true' || steps.filter.outputs.tics == 'true') }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
      id: filter
      with:
        filters: .github/filters.yaml

  TICS:
    needs: [check-paths]
    if: needs.check-paths.outputs.should-run == 'true'

    runs-on: [self-hosted-linux-amd64-resolute-large-tiobe]

    permissions:
      checks: write
      contents: read
      pull-requests: write  # for commenting with TICS results
    env:
      PROJECT: mir
      CCACHE_DIR: "${{ github.workspace }}/../ccache"
      TICS_CHANGED_LIST: tics_changed.list
      TICS_TMPDIR: /tmp/tics-tmpdir

    timeout-minutes: 360
    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # So we can determine the merge base
        fetch-depth: 0
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get install --yes --no-install-recommends \
          flake8 \
          pylint \
          rust-clippy

    - name: Launch the Workshop
      uses: canonical/launch-workshop@b9e184e38f49808ced78e25de19483fe02484c46 # v1.0.1

    - name: Set up CCache and mounts
      id: setup-ccache
      run: |
        workshop remount dev/mir:build build
        workshop remount dev/mir:ccache "${CCACHE_DIR}"

        # Find the merge base to avoid populating the cache with short lived cache entries
        # and evicting those we care for - from `main`
        echo "merge-base=$( git merge-base origin/main ${{ github.sha }} )" >> "$GITHUB_OUTPUT"

    # CCache is only _saved_ on push/workflow_dispatch, to run a complete build for TiCS analysis (QServer runs)
    # For PRs and merge groups, on the other hand, we want quicker runs that won't affect cache (QClient runs)
    - name: Restore CCache
      if: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) }}
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with: &ccache_with
        key: ccache-tics-${{ steps.setup-ccache.outputs.merge-base }}
        # if exact match isn't found, use the most recent entry for the task
        restore-keys: |
          ccache-tics-
        path: ${{ env.CCACHE_DIR }}

    - name: Ensure ccache size
      run: |
        # a full build yielded 180M cache
        echo "max_size = 250M" > "${CCACHE_DIR}/ccache.conf"

    - name: Configure
      run: >
        workshop run -- configure
        -DMIR_ENABLE_COVERAGE=ON
        -DMIR_USE_PRECOMPILED_HEADERS=OFF
        -DMIR_RUN_PERFORMANCE_TESTS=OFF

    - name: Build
      run: workshop run -- build

    - name: Clear CCache stats
      run: workshop exec -- ccache --show-stats --zero-stats

    - name: Store CCache
      if: ${{ !contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) }}
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with: *ccache_with

    - name: Measure coverage
      timeout-minutes: 45
      run: workshop run -- coverage

    - name: Get changed files
      if: github.event_name == 'merge_group'
      run: |
        # Every merge_group event runs for one pull request, so we can diff against parent
        git diff --name-only ${{ github.sha }}~1 ${{ github.sha }} >> "$TICS_CHANGED_LIST"

    - if: ${{ github.event.inputs.detach == 'true' }}
      name: Detach TICS QServer to prevent "project already connected" issue
      env:
        TICSAUTHTOKEN: ${{ secrets.TICSAUTHTOKEN }}
      run: &tics-detach |
        # shellcheck source=/dev/null
        source ~/.profile
        TICSMaintenance -project "${PROJECT}" -detach

    - name: Run TICS analysis
      uses: tiobe/tics-github-action@a53037a6bb9f71b6a97cdeb0ac41632266804b9e # v3.8.0
      timeout-minutes: 300  # avoid global job timeout to perform cleanup below
      with:
        mode: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && 'client' || 'qserver' }}
        calc: ${{ github.event.inputs.calc }}
        nocalc: ${{ github.event.inputs.nocalc }}
        project: ${{ env.PROJECT }}
        viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
        ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
        installTics: true
        filelist: ${{ github.event_name == 'merge_group' && env.TICS_CHANGED_LIST || '' }}
        # FIXME: workaround for a TICS bug
        additionalFlags: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) && '-resultdir build' || '' }}
        tmpdir: ${{ runner.debug && env.TICS_TMPDIR || null }}

    - if: ${{ contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && cancelled() }}
      name: Detach TICS QServer to prevent "project already connected" issue
      env:
        TICSAUTHTOKEN: ${{ secrets.TICSAUTHTOKEN }}
      run: *tics-detach

    - if: ${{ failure() && runner.debug }}
      name: Setup tmate session
      uses: canonical/action-tmate@bda82e73586a62bf621881aab872a527c8a46e2d # main @ 2026.03.02
      with:
        limit-access-to-actor: true
